<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Matinee mark — variants</title>
<style>
  body { margin:0; padding:40px; background:#17181b; color:#d9dce2; font-family:"Helvetica Neue",Helvetica,Arial,sans-serif; }
  h1 { font-size:13px; letter-spacing:2px; text-transform:uppercase; color:#8b919c; font-weight:600; }
  .row { display:flex; gap:28px; align-items:center; flex-wrap:wrap; margin:18px 0 34px; }
  .swatch { display:flex; align-items:center; justify-content:center; border-radius:10px; }
  .nav { width:320px; height:64px; background:linear-gradient(#a9c0da 0%,#7a97ba 6%,#5f80a8 49%,#4c6d95 50%,#3a5b80 100%); box-shadow:0 -1px 0 rgba(255,255,255,.5) inset; }
  .dark { background:#1b1d21; }
  .app { background:linear-gradient(#3a3c42,#111); }
  .item { display:flex; flex-direction:column; gap:8px; align-items:center; }
  .cap { font-size:11px; color:#7f8792; letter-spacing:.4px; }
  .mark { display:block; }
</style>
</head>
<body>
<h1>Matinee mark — arc of three orbs</h1>

<div class="row" id="row1"></div>
<div class="row" id="row2"></div>

<script>
const MARK = (size, uid) => {
  const r = 7.9;
  const orbs = [
    { cx: 8.1, cy: 19.4, fill: 'o' },
    { cx: 20, cy: 15.6, fill: 'g' },
    { cx: 31.9, cy: 19.4, fill: 'b' },
  ];
  const bodies = orbs.map(o => `
    <circle cx="${o.cx}" cy="${o.cy}" r="${r}" fill="url(#${o.fill}${uid})"/>
    <circle cx="${o.cx}" cy="${o.cy}" r="${r}" fill="url(#u${uid})"/>
    <ellipse cx="${o.cx - 2.3}" cy="${o.cy - 3.6}" rx="4.3" ry="2.8" transform="rotate(-20 ${o.cx - 2.3} ${o.cy - 3.6})" fill="url(#s${uid})"/>`).join('');
  return `
<svg class="mark" width="${size}" height="${size * 0.8}" viewBox="0 0 40 32" aria-hidden="true">
  <defs>    <radialGradient id="o${uid}" cx="34%" cy="26%" r="82%">
      <stop offset="0%" stop-color="#ffe2bd"/>
      <stop offset="34%" stop-color="#ff9f36"/>
      <stop offset="72%" stop-color="#fb7a05"/>
      <stop offset="100%" stop-color="#cf4f00"/>
    </radialGradient>
    <radialGradient id="g${uid}" cx="34%" cy="26%" r="82%">
      <stop offset="0%" stop-color="#b9ffd6"/>
      <stop offset="34%" stop-color="#5cf09a"/>
      <stop offset="72%" stop-color="#00d457"/>
      <stop offset="100%" stop-color="#00963e"/>
    </radialGradient>
    <radialGradient id="b${uid}" cx="34%" cy="26%" r="82%">
      <stop offset="0%" stop-color="#cdeeff"/>
      <stop offset="34%" stop-color="#7fd2fa"/>
      <stop offset="72%" stop-color="#35b4ef"/>
      <stop offset="100%" stop-color="#0a78b8"/>
    </radialGradient>
    <radialGradient id="s${uid}" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity=".85"/>
      <stop offset="55%" stop-color="#ffffff" stop-opacity=".26"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="u${uid}" cx="50%" cy="100%" r="70%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity=".42"/>
      <stop offset="70%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <filter id="d${uid}" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="1.1" stdDeviation=".9" flood-color="#00172b" flood-opacity=".5"/>
    </filter>
  </defs>
  <g filter="url(#d${uid})">${bodies}</g>
</svg>`;
};

let n = 0;
const box = (html, cls, cap) => {
  const d = document.createElement('div');
  d.className = 'item';
  const s = document.createElement('div');
  s.className = 'swatch ' + cls;
  s.innerHTML = html;
  const c = document.createElement('div');
  c.className = 'cap';
  c.textContent = cap;
  d.append(s, c);
  return d;
};

const r1 = document.getElementById('row1');
for (const size of [128, 64, 32, 19]) {
  const pad = size === 128 ? 34 : size === 64 ? 20 : 12;
  r1.append(box(MARK(size, ++n), 'dark', size + 'px'));
  r1.lastChild.querySelector('.swatch').style.padding = pad + 'px';
}

const r2 = document.getElementById('row2');
for (const size of [44, 30, 19]) {
  r2.append(box(MARK(size, ++n), 'nav', size + 'px'));
  r2.lastChild.querySelector('.swatch').style.padding = '10px ' + (24 - size / 3) + 'px';
}
</script>
</body>
</html>
