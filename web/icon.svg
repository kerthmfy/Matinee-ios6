<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="0.32" y2="1">
      <stop offset="0%" stop-color="#2c313a"/>
      <stop offset="46%" stop-color="#161a20"/>
      <stop offset="100%" stop-color="#07090b"/>
    </linearGradient>
    <linearGradient id="gloss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.16"/>
      <stop offset="55%" stop-color="#ffffff" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="o" cx="34%" cy="26%" r="82%">
      <stop offset="0%" stop-color="#ffe2bd"/>
      <stop offset="34%" stop-color="#ff9f36"/>
      <stop offset="72%" stop-color="#fb7a05"/>
      <stop offset="100%" stop-color="#cf4f00"/>
    </radialGradient>
    <radialGradient id="g" cx="34%" cy="26%" r="82%">
      <stop offset="0%" stop-color="#b9ffd6"/>
      <stop offset="34%" stop-color="#5cf09a"/>
      <stop offset="72%" stop-color="#00d457"/>
      <stop offset="100%" stop-color="#00963e"/>
    </radialGradient>
    <radialGradient id="b" cx="34%" cy="26%" r="82%">
      <stop offset="0%" stop-color="#cdeeff"/>
      <stop offset="34%" stop-color="#7fd2fa"/>
      <stop offset="72%" stop-color="#35b4ef"/>
      <stop offset="100%" stop-color="#0a78b8"/>
    </radialGradient>
    <radialGradient id="spec" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.92"/>
      <stop offset="55%" stop-color="#ffffff" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="bounce" cx="50%" cy="100%" r="70%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.4"/>
      <stop offset="70%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <filter id="orbShadow" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="11" stdDeviation="10" flood-color="#000000" flood-opacity="0.55"/>
    </filter>
  </defs>

  <g>
    <rect width="512" height="512" fill="url(#tile)"/>

    <!-- iOS 6 style gloss: a soft sheet over the top half, no seam line -->
    <rect width="512" height="300" fill="url(#gloss)"/>
    <ellipse cx="170" cy="-40" rx="330" ry="210" fill="#ffffff" opacity="0.06"/>

    <g filter="url(#orbShadow)">
      <circle cx="138" cy="272" r="80" fill="url(#o)"/>
      <circle cx="138" cy="272" r="80" fill="url(#bounce)"/>
      <ellipse cx="114" cy="234" rx="44" ry="28" transform="rotate(-20 114 234)" fill="url(#spec)"/>

      <circle cx="256" cy="240" r="80" fill="url(#g)"/>
      <circle cx="256" cy="240" r="80" fill="url(#bounce)"/>
      <ellipse cx="232" cy="202" rx="44" ry="28" transform="rotate(-20 232 202)" fill="url(#spec)"/>

      <circle cx="374" cy="272" r="80" fill="url(#b)"/>
      <circle cx="374" cy="272" r="80" fill="url(#bounce)"/>
      <ellipse cx="350" cy="234" rx="44" ry="28" transform="rotate(-20 350 234)" fill="url(#spec)"/>
    </g>

  </g>
</svg>
