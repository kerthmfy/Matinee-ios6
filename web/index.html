<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Matinee 6 · device preview</title>
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#171a1f">
<link rel="stylesheet" href="style.css">
</head>
<body>

<header class="site-head">
  <div class="brand">
    <span class="brand-mark" id="brand-mark" aria-hidden="true"></span>
    <span class="brand-name">Matinee</span>
    <span class="brand-sub">6 · device preview</span>
  </div>
  <div class="pills">
    <span class="pill" id="cache-pill" data-role="cache-pill">poster cache: 0 saved</span>
    <span class="pill pill-quiet" id="source-pill" data-role="source-pill">source: —</span>
  </div>
</header>

<main class="frames">
  <section class="device device-phone" aria-label="iPhone 4S preview">
    <div class="bezel bezel-phone">
      <div class="speaker"></div>
      <div class="screen screen-phone" id="phone"></div>
      <div class="home"></div>
    </div>
    <div class="device-label">iPhone 4S · 320 × 480 · iOS 6.1</div>
  </section>

  <section class="device device-pad" aria-label="iPad 2 preview">
    <div class="pad-scale">
      <div class="bezel bezel-pad">
        <div class="screen screen-pad" id="ipad"></div>
        <div class="pad-home"></div>
      </div>
    </div>
    <div class="device-label">iPad 2 · 768 × 1024 · iOS 6.1</div>
  </section>
</main>

<section class="console" aria-label="Event log">
  <div class="console-head">
    <span>Event log</span>
    <button type="button" id="console-clear">clear</button>
  </div>
  <ol id="eventlog" data-role="eventlog"></ol>
</section>

<script src="app.js"></script>
</body>
</html>
